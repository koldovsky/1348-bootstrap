<div
  class="modal fade"
  id="product-info-modal"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="product-info-modalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="product-info-modalLabel">Baby Yoda</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <img
          src="img/baby-yoda.svg"
          class="img-fluid rounded mx-auto d-block"
          alt="Baby Yoda"
        />
        <p>
          Experience the magic of Baby Yoda—small in size but big in wisdom and
          charm, perfect for fans of the Star Wars universe.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button type="button" class="btn btn-primary">Buy</button>
      </div>
    </div>
  </div>
</div>
